<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Service Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Sans:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --navy: #203265;
            --lime: #A8C500;
            --body-text: #2A2A2A;
            --light-grey: #D4D4D4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff; /* Page background */
            background-image: radial-gradient(circle at 15% 50%, rgba(168, 197, 0, 0.05), transparent 50%), 
                              radial-gradient(circle at 85% 30%, rgba(32, 50, 101, 0.05), transparent 50%);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            position: relative;
        }

        /* --- GLASSMORPHISM SCREENSAVER OVERLAY --- */
        .screensaver {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Ultra-modern frosted glass effect */
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px); /* Safari support */
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Smooth zoom-in unlock transition */
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                        visibility 0.6s, 
                        transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(1);
            cursor: pointer;
            perspective: 1500px;
        }

        .screensaver.hidden {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.08); /* Zoom in when unlocking */
            pointer-events: none;
        }

        .screensaver-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Glowing Backlight Aura */
        .aura-glow {
            position: absolute;
            width: 250px;
            height: 250px;
            background: var(--lime);
            filter: blur(80px);
            opacity: 0.4;
            border-radius: 50%;
            animation: pulseAura 4s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes pulseAura {
            0% { transform: scale(0.8); opacity: 0.2; }
            100% { transform: scale(1.5); opacity: 0.5; background: var(--navy); }
        }

        /* Sleek Tech Rings */
        .tech-ring {
            position: absolute;
            border-radius: 50%;
            z-index: 1;
            opacity: 0;
            animation: fadeInTech 1.5s forwards 0.3s;
        }

        .tech-ring.outer {
            width: 480px;
            height: 480px;
            border: 1px solid rgba(32, 50, 101, 0.15);
            border-top: 2px solid var(--navy);
            border-bottom: 2px solid var(--lime);
            animation: fadeInTech 1.5s forwards 0.3s, spinRing 25s linear infinite;
        }

        .tech-ring.inner {
            width: 380px;
            height: 380px;
            border: 1px dashed rgba(168, 197, 0, 0.4);
            border-left: 2px solid var(--lime);
            animation: fadeInTech 1.5s forwards 0.6s, spinRingReverse 15s linear infinite;
        }

        @keyframes fadeInTech { to { opacity: 1; } }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }
        @keyframes spinRingReverse { 100% { transform: rotate(-360deg); } }

        /* Premium Logo Reveal & Float */
        .screensaver-logo {
            width: 350px;
            height: auto;
            position: relative;
            z-index: 2;
            will-change: transform, filter, opacity;
            animation: 
                hologramReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                premiumFloat 6s ease-in-out 1.5s infinite alternate;
        }

        @keyframes hologramReveal {
            0% { 
                opacity: 0; 
                transform: scale(0.5) translateZ(-200px) rotateY(90deg); 
                filter: blur(20px); 
            }
            100% { 
                opacity: 1; 
                transform: scale(1) translateZ(0) rotateY(0deg); 
                filter: drop-shadow(0 20px 30px rgba(32, 50, 101, 0.15));
            }
        }

        @keyframes premiumFloat {
            0% { transform: scale(1) translateY(0); filter: drop-shadow(0 20px 30px rgba(32, 50, 101, 0.15)); }
            100% { transform: scale(1.05) translateY(-15px); filter: drop-shadow(0 30px 45px rgba(168, 197, 0, 0.25)); }
        }


        /* --- HEADER LOGO --- */
        .top-bar { position: absolute; top: 30px; left: 50px; z-index: 10; }
        .logo-link { display: inline-block; cursor: pointer; transition: transform 0.2s ease; }
        .logo-link:hover { transform: scale(1.05); }
        .header-logo { width: 120px; height: auto; display: block; border: none; }

        /* --- MAIN CONTAINER --- */
        .main-container { display: flex; width: 100%; max-width: 1100px; justify-content: space-between; align-items: center; padding: 0 50px; margin-top: 40px; }
        .text-section { flex: 1; padding-right: 50px; font-family: 'Fira Sans', sans-serif; display: flex; flex-direction: column; justify-content: center; }
        .animate-ipak { display: block; opacity: 0; transform: translateX(-30px); animation: slideIn 1s ease-out forwards; }
        .line-1 { font-size: 3.5rem; font-weight: 700; color: var(--navy); line-height: 1.1; margin-bottom: 10px; animation-delay: 0.2s; }
        .line-2 { font-size: 2.5rem; font-weight: 400; color: var(--lime); animation-delay: 0.4s; }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }

        /* --- LOGIN CARD --- */
        .form-section { flex: 0 0 auto; }
        .card { width: 380px; padding: 40px; border-radius: 24px; background: rgba(255, 255, 255, 0.9); border: 1px solid #f0f0f0; box-shadow: 0 20px 50px rgba(32, 50, 101, 0.08); text-align: center; animation: float 6s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        .header h2 { font-size: 1.6rem; font-weight: 700; color: var(--navy); margin-bottom: 5px; }
        .header p { color: #888; font-size: 0.9rem; margin-bottom: 30px; }
        .input-group { margin-bottom: 18px; text-align: left; position: relative; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--navy); }
        input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1.5px solid var(--light-grey); outline: none; font-size: 0.95rem; background: #fff; font-family: 'Inter', sans-serif; }
        input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(32, 50, 101, 0.05); }
        .password-toggle { position: absolute; right: 15px; top: 38px; cursor: pointer; color: #888; font-size: 0.9rem; user-select: none; }
        .password-toggle:hover { color: var(--navy); }
        .remember-box { display: flex; align-items: center; justify-content: flex-start; margin-bottom: 15px; font-size: 0.85rem; color: #555; }
        .remember-box input[type="checkbox"] { width: auto; margin-right: 8px; cursor: pointer; }
        .remember-box label { margin-bottom: 0; color: #555; font-weight: 400; cursor: pointer; }
        button { width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--lime); color: var(--navy); font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 5px; box-shadow: 0 4px 15px rgba(168, 197, 0, 0.3); }
        button:hover { transform: translateY(-2px); background: #96b000; }
        button:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }
        .toggle { margin-top: 20px; font-size: 0.85rem; color: #888; }
        .toggle span { color: var(--navy); cursor: pointer; font-weight: 700; text-decoration: underline; }
        .msg { margin-top: 15px; font-size: 0.85rem; padding: 10px; border-radius: 8px; display: none; }
        .error { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
        .success { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }

        /* --- MODERN LOADER ANIMATION --- */
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); z-index: 999999; display: none; justify-content: center; align-items: center; flex-direction: column; animation: fadeIn 0.3s ease-out; }
        .spinner { width: 60px; height: 60px; border: 5px solid rgba(32, 50, 101, 0.2); border-top: 5px solid var(--navy); border-right: 5px solid var(--lime); border-radius: 50%; animation: spinLoader 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite; margin-bottom: 20px; }
        .loader-text { font-family: 'Fira Sans', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--navy); letter-spacing: 2px; text-transform: uppercase; animation: pulse 1s ease-in-out infinite; }
        @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        @media (max-width: 900px) {
            .top-bar { position: relative; top: 0; left: 0; margin-bottom: 20px; text-align: center; width: 100%; display: flex; justify-content: center; }
            .main-container { flex-direction: column; padding: 20px; justify-content: center; margin-top: 10px; }
            .text-section { text-align: center; margin-bottom: 40px; padding-right: 0; align-items: center; }
            .line-1 { font-size: 2.2rem; }
            .line-2 { font-size: 1.6rem; }
            .card { width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        }
    </style>
</head>

<body>

    <!-- GLASSMORPHISM SCREENSAVER OVERLAY -->
    <div id="screensaver" class="screensaver">
        <div class="screensaver-wrapper">
            <!-- Glowing Backlight -->
            <div class="aura-glow"></div>

            <!-- Rotating Tech Rings -->
            <div class="tech-ring outer"></div>
            <div class="tech-ring inner"></div>
            
            <!-- 3D Animated Logo -->
            <img src="logo.png" alt="IPAK Screensaver Logo" class="screensaver-logo" id="ss-logo">
        </div>
    </div>

    <!-- LOADER OVERLAY -->
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text">Authenticating</div>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <a href="index.html" class="logo-link">
            <img src="logo.png" alt="IPAK Logo" class="header-logo">
        </a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <div class="text-section">
            <span class="animate-ipak line-1">Empowering Employees.</span>
            <span class="animate-ipak line-2">Simplifying Services.</span>
        </div>

        <div class="form-section">
            <div class="card">
                <div class="header">
                    <h2 id="title">Service Portal</h2>
                    <p id="subtitle">Secure Employee Access</p>
                </div>

                <div class="input-group">
                    <label>Corporate Email</label>
                    <input type="email" id="email" placeholder="name@company.com">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••">
                    <span class="password-toggle" onclick="togglePassword()">Show</span>
                </div>

                <div class="remember-box">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Keep me logged in</label>
                </div>

                <button id="mainBtn" onclick="submitForm()">Login to Portal</button>

                <div class="toggle">
                    <p id="toggleText">New User? <span onclick="switchMode()">Create Account</span></p>
                </div>

                <div id="msg" class="msg"></div>
            </div>
        </div>
    </div>

    <!-- FIREBASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
        // --- SCREENSAVER LOGIC ---
        const screensaver = document.getElementById('screensaver');
        const ssLogo = document.getElementById('ss-logo');
        
        let idleTime = 0;
        const idleTimeout = 6; // Set to 6 seconds

        // Hide screensaver on any user interaction
        function hideScreensaver() {
            if (!screensaver.classList.contains('hidden')) {
                screensaver.classList.add('hidden');
                
                // Reset animation state so it plays fresh next time
                setTimeout(() => {
                    ssLogo.style.animation = 'none';
                }, 600); // Wait for transition to finish
            }
            resetIdleTimer();
        }

        // Show screensaver and trigger new 3D intro animation
        function showScreensaver() {
            if (screensaver.classList.contains('hidden')) {
                screensaver.classList.remove('hidden');
                
                // Force browser reflow to restart CSS animation properly
                void ssLogo.offsetWidth; 
                ssLogo.style.animation = 'hologramReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards, premiumFloat 6s ease-in-out 1.5s infinite alternate';
            }
        }

        // Timer increment logic
        function timerIncrement() {
            idleTime++;
            // If idle for 6 seconds AND screensaver is currently hidden, show it
            if (idleTime >= idleTimeout && screensaver.classList.contains('hidden')) {
                showScreensaver();
            }
        }

        // Reset timer to 0
        function resetIdleTimer() {
            idleTime = 0;
        }

        // Listen for all interactions to hide screensaver and reset the timer
        ['mousedown', 'touchstart', 'mousemove', 'keypress', 'scroll', 'click'].forEach(evt => 
            document.addEventListener(evt, hideScreensaver, false)
        );

        // Run the timer every 1 second (1000ms)
        setInterval(timerIncrement, 1000);

        // --- FIREBASE & AUTH LOGIC ---
        const firebaseConfig = {
            apiKey: "AIzaSyCg251SA39YSg5p7lZ20Oe4BSzQFB4bm1E",
            authDomain: "employee-service-portal-b753b.firebaseapp.com",
            projectId: "employee-service-portal-b753b",
            storageBucket: "employee-service-portal-b753b.firebasestorage.app",
            messagingSenderId: "787703437938",
            appId: "1:787703437938:web:383b6f148067a0590400eb",
            measurementId: "G-DNMT4J7RGL"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let mode = "login";

        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const toggleBtn = document.querySelector(".password-toggle");
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleBtn.innerText = "Hide";
            } else {
                passwordInput.type = "password";
                toggleBtn.innerText = "Show";
            }
        }

        function switchMode() {
            const title = document.getElementById("title");
            const btn = document.getElementById("mainBtn");
            const toggleText = document.getElementById("toggleText");
            const msg = document.getElementById("msg");
            const rememberBox = document.querySelector(".remember-box");
            msg.style.display = "none";
            if (mode === "login") {
                mode = "signup";
                title.innerText = "Create Account";
                btn.innerText = "Register Now";
                toggleText.innerHTML = 'Already registered? <span onclick="switchMode()">Sign In</span>';
                rememberBox.style.display = "none";
            } else {
                mode = "login";
                title.innerText = "Service Portal";
                btn.innerText = "Login to Portal";
                toggleText.innerHTML = 'New User? <span onclick="switchMode()">Create Account</span>';
                rememberBox.style.display = "flex";
            }
        }

        function submitForm() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const btn = document.getElementById("mainBtn");
            if (!email || !password) { showMsg("Please enter both email and password", "error"); return; }
            btn.disabled = true;
            btn.innerText = "Processing...";
            const targetURL = "dashboard.html"; 

            if (mode === "signup") {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(() => {
                        showMsg("Account created! Redirecting...", "success");
                        setTimeout(() => { window.location.href = targetURL; }, 1500);
                    })
                    .catch(err => {
                        showMsg(err.message, "error");
                        btn.disabled = false;
                        btn.innerText = "Register Now";
                    });
            } else {
                const rememberMe = document.getElementById("rememberMe").checked;
                const persistenceType = rememberMe ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
                auth.setPersistence(persistenceType)
                    .then(() => auth.signInWithEmailAndPassword(email, password))
                    .then(() => {
                        showMsg("Credentials Verified!", "success");
                        setTimeout(() => {
                            document.getElementById('loader').style.display = 'flex';
                            setTimeout(() => { window.location.href = targetURL; }, 1000);
                        }, 500);
                    })
                    .catch(err => {
                        showMsg("Invalid Credentials", "error");
                        btn.disabled = false;
                        btn.innerText = "Login to Portal";
                    });
            }
        }

        function showMsg(text, type) {
            const msg = document.getElementById("msg");
            msg.innerText = text;
            msg.className = `msg ${type}`;
            msg.style.display = "block";
        }
    </script>
</body>
</html>
